<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ClapOut Studio</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Favicon set generated from the ClapOut logo (public/ icons; ICO carries 16/32/48). -->
    <link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <meta name="theme-color" content="#EC612C" />
    <!-- Public-page theme, before first paint. Same resolution as ThemeService:
         the cookie shared with clapoutcreators.com, this origin's storage, the
         OS. Skipped when a session token is present: the studio is light. -->
    <script>
      (function () {
        try {
          var m = document.cookie.match(/(?:^|;\s*)clapout-theme=(dark|light)(?:;|$)/);
          var t = m ? m[1] : localStorage.getItem('theme');
          var dark = t ? t === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          var signedIn =
            localStorage.getItem('clapout.token') || sessionStorage.getItem('clapout.token');
          if (dark && !signedIn) document.documentElement.classList.add('co-dark');
        } catch (e) {}
      })();
    </script>
    <!-- Same heading font the landing page (clapoutcreators.com) loads. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
