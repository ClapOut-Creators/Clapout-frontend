<main class="flex min-h-svh flex-col items-center justify-center bg-white px-4 py-10">
  <div class="flex h-[66px] w-[66px] items-center justify-center rounded-[20px] bg-primary p-2">
    <img
      src="/logo/clapout-logo.png"
      alt=""
      class="h-[50px] w-[50px] object-contain select-none"
      draggable="false"
    />
  </div>

  <h1 class="mt-[5px] text-center text-[32px] leading-[48px] font-semibold text-black/80">
    Welcome back
  </h1>
  <p class="-mt-0.5 max-w-[456px] text-center text-[18px] leading-[21px] text-[#464646]">
    Sign in to manage campaign, registrations and payouts
  </p>

  @if (errorMessage()) {
    <div class="mt-4 w-full max-w-[423px]">
      <p-message severity="error" [closable]="false">{{ errorMessage() }}</p-message>
    </div>
  }

  <form
    class="mt-4 flex w-full max-w-[423px] flex-col gap-3"
    [formGroup]="form"
    (ngSubmit)="submit()"
    novalidate
  >
    <div class="flex flex-col gap-2">
      <label class="text-[18px] leading-[21px] font-medium text-[#0C0C0C]" for="signin-email"
        >Email</label
      >
      <input
        pInputText
        id="signin-email"
        type="email"
        placeholder="Your email"
        autocomplete="email"
        formControlName="email"
        class="h-[50px] w-full rounded-xl border border-[#D7D7D7] bg-white px-[18px] text-[18px] placeholder:text-[#DFDFDF]"
        [attr.aria-invalid]="fieldError('email') ? 'true' : null"
        [attr.aria-describedby]="fieldError('email') ? 'signin-email-error' : null"
      />
      @if (fieldError('email'); as message) {
        <p id="signin-email-error" class="text-sm text-red-700">{{ message }}</p>
      }
    </div>

    <div class="flex flex-col gap-2">
      <label class="text-[18px] leading-[21px] font-medium text-[#0C0C0C]" for="signin-password"
        >Password</label
      >
      <div class="flex flex-col gap-[14px]">
        <p-password
          inputId="signin-password"
          formControlName="password"
          class="block w-full"
          inputStyleClass="h-[50px] w-full rounded-xl border border-[#D7D7D7] bg-white pl-[18px] pr-[52px] text-[18px] placeholder:text-[#DFDFDF]"
          placeholder="Your password"
          autocomplete="current-password"
          [feedback]="false"
          [toggleMask]="true"
        >
          <ng-template #showicon let-iconClass="class">
            <svg
              data-p-icon="lock"
              aria-hidden="true"
              [size]="22"
              [class]="iconClass + ' !mt-[-11px] !right-[16px] !h-[22px] !w-[22px] !text-[#888888]'"
            ></svg>
          </ng-template>
        </p-password>
        @if (fieldError('password'); as message) {
          <p class="text-sm text-red-700">{{ message }}</p>
        }

        <div class="flex flex-wrap items-center justify-between gap-x-4 gap-y-2">
          <div class="flex items-center gap-[6px]">
            <p-checkbox
              inputId="signin-remember"
              formControlName="rememberMe"
              class="[&_.p-checkbox-box]:!h-4 [&_.p-checkbox-box]:!w-4 [&_.p-checkbox-box]:!rounded-[4px] [&_.p-checkbox-box]:!border-[#D7D7D7]"
              [binary]="true"
            />
            <label
              class="cursor-pointer text-[18px] leading-[21px] text-[#464646]"
              for="signin-remember"
              >Remember me</label
            >
          </div>
          <a
            routerLink="/auth/forgot-password"
            class="text-[18px] leading-[21px] text-[#321104] no-underline hover:underline"
            >Forgot password?</a
          >
        </div>
      </div>
    </div>

    <p-button
      type="submit"
      label="Sign in"
      styleClass="!h-[50px] !w-full !justify-center !rounded-xl !bg-primary !border-primary !text-[18px] !shadow-none"
      [fluid]="true"
      [loading]="submitting()"
      [disabled]="submitting()"
    />
  </form>

  <p class="mt-4 text-center text-[18px] leading-[21px] text-[#464646]">
    New to ClapOut?
    <a
      [routerLink]="signUpLink()"
      [queryParams]="signUpQuery()"
      class="font-semibold text-[#1A9BFB] no-underline hover:underline"
      >Create an account</a
    >
  </p>
</main>
