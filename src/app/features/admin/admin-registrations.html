<main class="min-h-screen">
  <div class="mx-auto">
    <app-page-header
      breadcrumb="Registrations"
      title="Registered clippers"
      [subtitle]="subtitle()"
    />

    <div class="mt-4 flex flex-wrap gap-2" role="tablist" aria-label="Clipper views">
      @for (item of views; track item.value) {
        <button
          type="button"
          role="tab"
          class="cursor-pointer rounded-full border-0 px-4 py-2 text-[15px] font-medium transition-colors"
          [class]="tabClass(item.value)"
          [attr.aria-selected]="activeView() === item.value"
          (click)="setView(item.value)"
        >
          {{ item.label }}
        </button>
      }
    </div>

    @if (optionsError() && activeView() === 'registrations') {
      <div class="mt-4">
        <p-message severity="warn" [closable]="false">
          {{ optionsError() }} Filtering by campaign is unavailable, but the list below still loads.
        </p-message>
      </div>
    }

    <section
      class="mt-4 rounded-[18.83px] border border-[#ECECEC] bg-[#FFFFFF] p-4"
      aria-labelledby="admin-registrations-list-heading"
    >
      <h2 id="admin-registrations-list-heading" class="sr-only">Clipper list</h2>

      <!-- Each table owns its own toolbar, so it sits at the top of this panel. -->
      @if (activeView() === 'clippers') {
        <app-creators-table class="block" />
      } @else {
        <app-clippers-table class="block" [campaignOptions]="campaignOptions()" />
      }
    </section>
  </div>
</main>
