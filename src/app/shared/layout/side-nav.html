<!-- Desktop: fixed-width left rail. -->
<aside
  class="sticky top-0 hidden h-screen w-64 shrink-0 flex-col border-r border-surface-200 bg-surface-0 lg:flex"
>
  <a
    routerLink="/campaigns"
    class="flex items-center gap-3 px-5 pb-4 pt-5 text-surface-900 no-underline"
  >
    <!-- Same mark the landing navbar uses; the artwork carries its own wordmark. -->
    <img src="/clapout-logo.png" alt="ClapOut" class="h-10 w-10 select-none" draggable="false" />
  </a>

  <!-- Rendered for signed-in users only (see App's layout switch). -->
  <nav aria-label="Primary" class="flex flex-1 flex-col gap-1 px-3">
    <a
      routerLink="/campaigns"
      routerLinkActive="bg-primary-50 !text-primary-700"
      class="rounded-lg px-3 py-2 text-sm font-medium text-surface-600 no-underline hover:bg-surface-100 hover:text-surface-900"
      >Campaigns</a
    >
    <a
      routerLink="/creator/dashboard"
      routerLinkActive="bg-primary-50 !text-primary-700"
      class="rounded-lg px-3 py-2 text-sm font-medium text-surface-600 no-underline hover:bg-surface-100 hover:text-surface-900"
      >Dashboard</a
    >
  </nav>

  <div class="border-t border-surface-200 px-3 py-4">
    <p class="truncate px-3 pb-2 text-sm text-surface-500">{{ user()?.fullName }}</p>
    <p-button
      label="Sign out"
      severity="secondary"
      size="small"
      [text]="true"
      (onClick)="signOut()"
    />
  </div>
</aside>

<!-- Mobile: slim top bar; the same links live in a left drawer. -->
<header
  class="sticky top-0 z-20 flex items-center justify-between border-b border-surface-200 bg-surface-0 px-4 py-3 lg:hidden"
>
  <a routerLink="/campaigns" class="flex items-center text-surface-900 no-underline">
    <img src="/clapout-logo.png" alt="ClapOut" class="h-9 w-9 select-none" draggable="false" />
  </a>
  <button
    type="button"
    class="rounded-lg p-2 text-surface-700 hover:bg-surface-100"
    aria-label="Open menu"
    [attr.aria-expanded]="drawerOpen()"
    (click)="drawerOpen.set(true)"
  >
    <svg
      aria-hidden="true"
      class="h-6 w-6"
      fill="none"
      viewBox="0 0 24 24"
      stroke="currentColor"
      stroke-width="2"
    >
      <path stroke-linecap="round" d="M4 6h16M4 12h16M4 18h16" />
    </svg>
  </button>
</header>

<p-drawer
  position="left"
  header="Menu"
  [visible]="drawerOpen()"
  (visibleChange)="drawerOpen.set($event)"
  styleClass="!w-72"
>
  <nav aria-label="Primary" class="flex flex-col gap-1">
    <a
      routerLink="/campaigns"
      routerLinkActive="bg-primary-50 !text-primary-700"
      class="rounded-lg px-3 py-2 text-sm font-medium text-surface-600 no-underline hover:bg-surface-100 hover:text-surface-900"
      (click)="closeDrawer()"
      >Campaigns</a
    >
    @if (isSignedIn()) {
      <a
        routerLink="/creator/dashboard"
        routerLinkActive="bg-primary-50 !text-primary-700"
        class="rounded-lg px-3 py-2 text-sm font-medium text-surface-600 no-underline hover:bg-surface-100 hover:text-surface-900"
        (click)="closeDrawer()"
        >Dashboard</a
      >
      <p class="mt-4 truncate border-t border-surface-200 px-3 pt-4 text-sm text-surface-500">
        {{ user()?.fullName }}
      </p>
      <p-button
        label="Sign out"
        severity="secondary"
        size="small"
        [text]="true"
        (onClick)="signOut()"
      />
    } @else {
      <a
        routerLink="/auth/sign-in"
        class="rounded-lg px-3 py-2 text-sm font-medium text-surface-600 no-underline hover:bg-surface-100 hover:text-surface-900"
        (click)="closeDrawer()"
        >Sign in</a
      >
      <a
        routerLink="/auth/sign-up"
        class="rounded-lg bg-primary px-3 py-2 text-center text-sm font-medium text-primary-contrast no-underline"
        (click)="closeDrawer()"
        >Get started</a
      >
    }
  </nav>
</p-drawer>
